[workspace]
members = ["crates/config", "crates/edge-proxy", "crates/lb", "crates/health"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
anyhow = { version = "=1.0.104" }
bytes = { version = "=1.12.1" }
http = { version = "=1.5.0" }
http-body = { version = "=1.1.0" }
http-body-util = { version = "=0.1.5" }
hyper = { version = "=1.12.0", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "=0.1.21", features = ["server-auto", "tokio"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "io-util"] }
tokio-util = { version = "=0.7.20", features = ["rt"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = { version = "=2.2.0" }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
serde = { version = "=1.0.229", features = ["derive"] }
toml = { version = "=1.1.8" }
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "pem", "crypto"] }
tempfile = { version = "=3.27.0" }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
