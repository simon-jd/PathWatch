static_resources:
  listeners:
  - name: ingress
    address: {socket_address: {address: 127.0.0.1, port_value: 18443}}
    filter_chains:
    - transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
          common_tls_context:
            alpn_protocols: [h2, http/1.1]
            tls_params: {tls_minimum_protocol_version: TLSv1_3, tls_maximum_protocol_version: TLSv1_3}
            tls_certificates:
            - certificate_chain: {filename: .cache/task13/runtime/cert.pem}
              private_key: {filename: .cache/task13/runtime/key.pem}
      filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress
          codec_type: AUTO
          stream_idle_timeout: 10s
          http2_protocol_options: {max_concurrent_streams: 1024}
          common_http_protocol_options: {idle_timeout: 300s}
          route_config:
            name: local
            virtual_hosts:
            - name: echo
              domains: ['bench.pathwatch.test', 'bench.pathwatch.test:18443']
              routes:
              - match: {prefix: /}
                route: {cluster: echo, timeout: 10s, host_rewrite_literal: '127.0.0.1:19090'}
          http_filters:
          - name: envoy.filters.http.router
            typed_config: {'@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router}
  clusters:
  - name: echo
    type: STATIC
    connect_timeout: 10s
    lb_policy: ROUND_ROBIN
    circuit_breakers:
      thresholds: [{priority: DEFAULT, max_connections: 512, max_pending_requests: 1024, max_requests: 1024, max_retries: 0}]
    load_assignment:
      cluster_name: echo
      endpoints:
      - lb_endpoints:
        - endpoint: {address: {socket_address: {address: 127.0.0.1, port_value: 19090}}}
admin:
  access_log_path: /dev/null
  address: {socket_address: {address: 127.0.0.1, port_value: 19092}}
