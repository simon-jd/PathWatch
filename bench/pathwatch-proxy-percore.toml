listeners = [{addr="127.0.0.1:18443", tls={certs=[{sni="bench.pathwatch.test",cert=".cache/task13/runtime/cert.pem",key=".cache/task13/runtime/key.pem"}]}}]
routes = [{host="bench.pathwatch.test",path_prefix="/",cluster="echo"}]
