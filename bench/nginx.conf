worker_processes 2;
pid .cache/task13/runtime/nginx.pid;
error_log stderr error;
daemon off;
events { worker_connections 4096; }
http {
 access_log off;
 client_body_temp_path .cache/task13/runtime/client_temp;
 proxy_temp_path .cache/task13/runtime/proxy_temp;
 upstream echo { server 127.0.0.1:19090; keepalive 256; keepalive_requests 1000000000; keepalive_timeout 300s; }
 server {
  listen 127.0.0.1:18443 ssl;
  http2 on;
  server_name bench.pathwatch.test;
  ssl_certificate ../.cache/task13/runtime/cert.pem;
  ssl_certificate_key ../.cache/task13/runtime/key.pem;
  ssl_protocols TLSv1.3;
  ssl_session_cache off;
  keepalive_requests 1000000000;
  keepalive_timeout 300s;
  http2_max_concurrent_streams 1024;
  location / {
   proxy_pass http://echo;
   proxy_http_version 1.1;
   proxy_set_header Connection "";
   proxy_set_header Host 127.0.0.1:19090;
   proxy_next_upstream off;
   proxy_connect_timeout 10s;
   proxy_read_timeout 10s;
   proxy_send_timeout 10s;
   proxy_buffering off;
  }
 }
}
