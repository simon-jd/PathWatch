{{- $app := .Values.appNamespace }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  labels: { app.kubernetes.io/part-of: pathwatch, project: pathwatch }
---
# Pod discovery only, and only in the application namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pathwatch-prometheus-discovery
  namespace: {{ $app }}
  labels: { app.kubernetes.io/part-of: pathwatch, project: pathwatch }
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pathwatch-prometheus-discovery
  namespace: {{ $app }}
  labels: { app.kubernetes.io/part-of: pathwatch, project: pathwatch }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: pathwatch-prometheus-discovery }
subjects:
  - { kind: ServiceAccount, name: prometheus, namespace: {{ .Release.Namespace }} }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus
  labels: { app.kubernetes.io/part-of: pathwatch, project: pathwatch }
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.scrapeInterval }}
      scrape_timeout: 3s
    scrape_configs:
    {{- range $job := list "core" "frontend" }}
      - job_name: {{ $job }}
        scheme: https
        tls_config:
          ca_file: /tls/ca.pem
          cert_file: /tls/prometheus.pem
          key_file: /tls/prometheus-key.pem
          server_name: metrics.pathwatch.local
        kubernetes_sd_configs:
          - role: pod
            namespaces: { names: [{{ $app }}] }
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component, __meta_kubernetes_pod_container_port_name]
            regex: {{ $job }};metrics
            action: keep
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_rollouts_pod_template_hash]
            target_label: rollouts_pod_template_hash
    {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels: { app.kubernetes.io/part-of: pathwatch, project: pathwatch }
spec:
  selector: { app.kubernetes.io/name: prometheus }
  ports:
    - { name: http, port: 9090, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels: { app.kubernetes.io/part-of: pathwatch, project: pathwatch }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: prometheus }
  template:
    metadata:
      labels: { app.kubernetes.io/name: prometheus, app.kubernetes.io/part-of: pathwatch, project: pathwatch }
      annotations:
        checksum/config: {{ .Values | toJson | sha256sum | trunc 16 }}
    spec:
      serviceAccountName: prometheus
      securityContext: { fsGroup: 65534 }
      containers:
        - name: prometheus
          image: {{ .Values.images.prometheus }}
          imagePullPolicy: Never
          args: ["--config.file=/etc/prometheus/prometheus.yml",
                 "--storage.tsdb.path=/prometheus",
                 "--storage.tsdb.retention.time={{ .Values.retention }}",
                 "--web.listen-address=0.0.0.0:9090"]
          ports:
            - { name: http, containerPort: 9090 }
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus, readOnly: true }
            - { name: data, mountPath: /prometheus }
            - { name: tls, mountPath: /tls, readOnly: true }
      volumes:
        - name: config
          configMap: { name: prometheus }
        - name: data
          emptyDir: { sizeLimit: 256Mi }
        - name: tls
          secret: { secretName: pathwatch-prometheus-tls, defaultMode: 0440 }
