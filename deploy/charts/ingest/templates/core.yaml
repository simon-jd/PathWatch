{{/*
Sole core: one pod, one Store. ClickHouse runs as a native sidecar bound to
127.0.0.1 only (no Service exposes it); the core reaches it over loopback as
ingest/README.md requires. OnDelete: core replacement is manual and serial.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: core-clickhouse
  labels: {{- include "ingest.labels" . | nindent 4 }}
data:
  # Replaces the image's file of the same name, which listens on 0.0.0.0/::.
  docker_related_config.xml: |
    <clickhouse>
      <listen_host>127.0.0.1</listen_host>
    </clickhouse>
---
apiVersion: v1
kind: Service
metadata:
  name: core
  labels: {{- include "ingest.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: core }
  ports:
    - { name: core-rpc, port: 9444, targetPort: core-rpc }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: core
  labels: {{- include "ingest.labels" . | nindent 4 }}
spec:
  replicas: 1
  serviceName: core
  updateStrategy: { type: OnDelete }
  selector:
    matchLabels: { app.kubernetes.io/name: core }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: core
        app.kubernetes.io/component: core
        {{- include "ingest.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        fsGroup: 65532
      initContainers:
        - name: clickhouse
          image: {{ .Values.images.clickhouse }}
          imagePullPolicy: Never
          restartPolicy: Always
          env:
            - { name: CLICKHOUSE_DB, value: pathwatch }
            - { name: CLICKHOUSE_USER, value: pathwatch_ingest }
            - name: CLICKHOUSE_PASSWORD
              valueFrom: { secretKeyRef: { name: pathwatch-clickhouse, key: password } }
          startupProbe:
            exec:
              command: ["/bin/sh", "-c", "clickhouse-client --user \"$CLICKHOUSE_USER\" --password \"$CLICKHOUSE_PASSWORD\" -q 'SELECT 1'"]
            periodSeconds: 2
            failureThreshold: 60
          resources:
            requests: { cpu: 200m, memory: 1Gi }
            limits: { memory: 2Gi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/clickhouse }
            - { name: clickhouse-logs, mountPath: /var/log/clickhouse-server }
            - { name: clickhouse-config, mountPath: /etc/clickhouse-server/config.d/docker_related_config.xml, subPath: docker_related_config.xml, readOnly: true }
      containers:
        - name: core
          image: {{ required "images.ingest" .Values.images.ingest }}
          imagePullPolicy: Never
          command: ["/ingest"]
          args: ["-mode", "core",
                 "-core-listen", "0.0.0.0:9444",
                 "-core-ca", "/tls/ca.pem", "-core-cert", "/tls/core.pem", "-core-key", "/tls/core-key.pem",
                 "-core-server-name", {{ .Values.core.serverName | quote }},
                 "-core-frontends", {{ .Values.core.frontendIdentity | quote }},
                 "-journal", "/journal", "-journal-max-bytes", {{ .Values.core.journalMaxBytes | int64 | toString | quote }},
                 "-clickhouse-url", "http://127.0.0.1:8123", "-database", "pathwatch", "-clickhouse-user", "pathwatch_ingest",
                 "-metrics", "127.0.0.1:9091"]
          env:
            - name: PATHWATCH_CLICKHOUSE_PASSWORD
              valueFrom: { secretKeyRef: { name: pathwatch-clickhouse, key: password } }
          ports:
            - { name: core-rpc, containerPort: 9444 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 1Gi }
          securityContext:
            {{- include "ingest.securityContext" . | nindent 12 }}
          volumeMounts:
            - { name: journal, mountPath: /journal }
            - { name: core-tls, mountPath: /tls, readOnly: true }
        - {{- include "ingest.adminbridge" (dict "image" .Values.images.ingest "format" "core") | nindent 10 }}
      volumes:
        - name: clickhouse-config
          configMap: { name: core-clickhouse }
        - name: clickhouse-logs
          emptyDir: { medium: Memory, sizeLimit: 16Mi }
        - name: core-tls
          secret: { secretName: pathwatch-core-tls, defaultMode: 0440 }
        - name: metrics-tls
          secret: { secretName: pathwatch-metrics-tls, defaultMode: 0440 }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: {{ .Values.core.storage.data }} } }
    - metadata: { name: journal }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: {{ .Values.core.storage.journal }} } }
