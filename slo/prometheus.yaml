global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/pathwatch/generated.rules.yaml
scrape_configs:
  - job_name: pathwatch-observer
    static_configs:
      - targets: [127.0.0.1:9465]
  - job_name: pathwatch-ingest
    static_configs:
      - targets: [127.0.0.1:9091]
  - job_name: pathwatch-home-probe
    static_configs:
      - targets: [127.0.0.1:9464]
# No external receivers. Recording/alert state is inspectable via Prometheus API.
