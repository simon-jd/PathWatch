frr defaults traditional
hostname t2
log stdout informational
service integrated-vtysh-config
!
! AS64602 is a lax transit: it does not filter its customers' prefixes. That is
! what lets the c2 leak and the c3 /25 hijack propagate.
bgp community-list standard CUSTOMER permit 64602:100
!
route-map FROM-CUSTOMER permit 10
 set local-preference 200
 set community 64602:100
exit
route-map FROM-PEER permit 10
 set local-preference 100
exit
route-map TO-CUSTOMER permit 10
exit
route-map TO-PEER permit 10
 match community CUSTOMER
exit
route-map TO-COLLECTOR permit 10
exit
route-map DENY deny 10
exit
!
router bgp 64602
 bgp router-id 10.117.4.3
 neighbor 10.117.3.2 remote-as 64500
 neighbor 10.117.3.2 description pop2 (customer)
 neighbor 10.117.4.2 remote-as 64500
 neighbor 10.117.4.2 description pop3 (customer)
 neighbor 10.117.8.2 remote-as 64702
 neighbor 10.117.8.2 description c2 (customer)
 neighbor 10.117.9.2 remote-as 64703
 neighbor 10.117.9.2 description c3 (customer)
 neighbor 10.117.10.2 remote-as 64601
 neighbor 10.117.10.2 description t1a (peer)
 neighbor 10.117.100.2 remote-as 65000
 neighbor 10.117.100.2 description collector
 address-family ipv4 unicast
  neighbor 10.117.3.2 route-map FROM-CUSTOMER in
  neighbor 10.117.3.2 route-map TO-CUSTOMER out
  neighbor 10.117.4.2 route-map FROM-CUSTOMER in
  neighbor 10.117.4.2 route-map TO-CUSTOMER out
  neighbor 10.117.8.2 route-map FROM-CUSTOMER in
  neighbor 10.117.8.2 route-map TO-CUSTOMER out
  neighbor 10.117.9.2 route-map FROM-CUSTOMER in
  neighbor 10.117.9.2 route-map TO-CUSTOMER out
  neighbor 10.117.10.2 route-map FROM-PEER in
  neighbor 10.117.10.2 route-map TO-PEER out
  neighbor 10.117.100.2 route-map DENY in
  neighbor 10.117.100.2 route-map TO-COLLECTOR out
 exit-address-family
exit
