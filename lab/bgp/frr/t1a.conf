frr defaults traditional
hostname t1a
log stdout informational
service integrated-vtysh-config
!
! AS64601 filters every customer to its registered prefixes.
ip prefix-list ANYCAST seq 5 permit 198.51.100.0/24
ip prefix-list C1 seq 5 permit 192.0.2.0/26
bgp community-list standard CUSTOMER permit 64601:100
!
route-map FROM-POP permit 10
 match ip address prefix-list ANYCAST
 set local-preference 200
 set community 64601:100
exit
route-map FROM-C1 permit 10
 match ip address prefix-list C1
 set local-preference 200
 set community 64601:100
exit
route-map FROM-PEER permit 10
 set local-preference 100
exit
route-map TO-CUSTOMER permit 10
exit
! Peers and providers only get customer routes (valley-free export).
route-map TO-PEER permit 10
 match community CUSTOMER
exit
route-map TO-COLLECTOR permit 10
exit
route-map DENY deny 10
exit
!
router bgp 64601
 bgp router-id 10.117.5.2
 neighbor 10.117.1.2 remote-as 64500
 neighbor 10.117.1.2 description pop1 (customer)
 neighbor 10.117.6.2 remote-as 64701
 neighbor 10.117.6.2 description c1 (customer)
 neighbor 10.117.10.3 remote-as 64602
 neighbor 10.117.10.3 description t2 (peer)
 neighbor 10.117.5.3 remote-as 64601
 neighbor 10.117.5.3 description t1b (iBGP)
 neighbor 10.117.100.2 remote-as 65000
 neighbor 10.117.100.2 description collector
 address-family ipv4 unicast
  neighbor 10.117.1.2 route-map FROM-POP in
  neighbor 10.117.1.2 route-map TO-CUSTOMER out
  neighbor 10.117.6.2 route-map FROM-C1 in
  neighbor 10.117.6.2 route-map TO-CUSTOMER out
  neighbor 10.117.10.3 route-map FROM-PEER in
  neighbor 10.117.10.3 route-map TO-PEER out
  neighbor 10.117.5.3 next-hop-self
  neighbor 10.117.100.2 route-map DENY in
  neighbor 10.117.100.2 route-map TO-COLLECTOR out
 exit-address-family
exit
