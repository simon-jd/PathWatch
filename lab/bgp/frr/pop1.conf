frr defaults traditional
hostname pop1
log stdout informational
service integrated-vtysh-config
!
! Anchor for the anycast /24; 198.51.100.1/32 lives on lo.
ip route 198.51.100.0/24 blackhole
!
ip prefix-list ANYCAST seq 5 permit 198.51.100.0/24
!
route-map ANYCAST-OUT permit 10
 match ip address prefix-list ANYCAST
exit
route-map ACCEPT permit 10
exit
!
router bgp 64500
 bgp router-id 10.117.1.2
 neighbor 10.117.1.3 remote-as 64601
 neighbor 10.117.1.3 description t1a (provider)
 address-family ipv4 unicast
  network 198.51.100.0/24
  neighbor 10.117.1.3 route-map ACCEPT in
  neighbor 10.117.1.3 route-map ANYCAST-OUT out
 exit-address-family
exit
