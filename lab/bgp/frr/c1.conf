frr defaults traditional
hostname c1
log stdout informational
service integrated-vtysh-config
!
ip route 192.0.2.0/26 blackhole
ip prefix-list OWN seq 5 permit 192.0.2.0/26
!
route-map ACCEPT permit 10
exit
route-map OWN-ONLY permit 10
 match ip address prefix-list OWN
exit
!
router bgp 64701
 bgp router-id 10.117.6.2
 neighbor 10.117.6.3 remote-as 64601
 neighbor 10.117.6.3 description t1a (provider)
 address-family ipv4 unicast
  network 192.0.2.0/26
  neighbor 10.117.6.3 route-map ACCEPT in
  neighbor 10.117.6.3 route-map OWN-ONLY out
 exit-address-family
exit
