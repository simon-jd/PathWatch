frr defaults traditional
hostname c3
log stdout informational
service integrated-vtysh-config
!
ip route 192.0.2.128/26 blackhole
ip prefix-list OWN seq 5 permit 192.0.2.128/26
!
route-map ACCEPT permit 10
exit
route-map OWN-ONLY permit 10
 match ip address prefix-list OWN
exit
!
router bgp 64703
 bgp router-id 10.117.9.2
 neighbor 10.117.9.3 remote-as 64602
 neighbor 10.117.9.3 description t2 (provider)
 address-family ipv4 unicast
  network 192.0.2.128/26
  neighbor 10.117.9.3 route-map ACCEPT in
  neighbor 10.117.9.3 route-map OWN-ONLY out
 exit-address-family
exit
