frr defaults traditional
hostname t1b
log stdout informational
service integrated-vtysh-config
!
ip prefix-list ANYCAST seq 5 permit 198.51.100.0/24
ip prefix-list C2 seq 5 permit 192.0.2.64/26
bgp community-list standard CUSTOMER permit 64601:100
!
route-map FROM-POP permit 10
 match ip address prefix-list ANYCAST
 set local-preference 200
 set community 64601:100
exit
route-map FROM-C2 permit 10
 match ip address prefix-list C2
 set local-preference 200
 set community 64601:100
exit
route-map TO-CUSTOMER permit 10
exit
route-map TO-COLLECTOR permit 10
exit
route-map DENY deny 10
exit
!
router bgp 64601
 bgp router-id 10.117.5.3
 neighbor 10.117.2.2 remote-as 64500
 neighbor 10.117.2.2 description pop2 (customer)
 neighbor 10.117.7.2 remote-as 64702
 neighbor 10.117.7.2 description c2 (customer)
 neighbor 10.117.5.2 remote-as 64601
 neighbor 10.117.5.2 description t1a (iBGP)
 neighbor 10.117.100.2 remote-as 65000
 neighbor 10.117.100.2 description collector
 address-family ipv4 unicast
  neighbor 10.117.2.2 route-map FROM-POP in
  neighbor 10.117.2.2 route-map TO-CUSTOMER out
  neighbor 10.117.7.2 route-map FROM-C2 in
  neighbor 10.117.7.2 route-map TO-CUSTOMER out
  neighbor 10.117.5.2 next-hop-self
  neighbor 10.117.100.2 route-map DENY in
  neighbor 10.117.100.2 route-map TO-COLLECTOR out
 exit-address-family
exit
