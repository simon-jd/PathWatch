frr defaults traditional
hostname pop2
log stdout informational
service integrated-vtysh-config
!
ip route 198.51.100.0/24 blackhole
!
ip prefix-list ANYCAST seq 5 permit 198.51.100.0/24
!
route-map ANYCAST-OUT permit 10
 match ip address prefix-list ANYCAST
exit
! pop2 is a backup site for AS64602's customers.
route-map ANYCAST-OUT-BACKUP permit 10
 match ip address prefix-list ANYCAST
 set as-path prepend 64500 64500
exit
route-map ACCEPT permit 10
exit
!
router bgp 64500
 bgp router-id 10.117.2.2
 neighbor 10.117.2.3 remote-as 64601
 neighbor 10.117.2.3 description t1b (provider)
 neighbor 10.117.3.3 remote-as 64602
 neighbor 10.117.3.3 description t2 (provider)
 address-family ipv4 unicast
  network 198.51.100.0/24
  neighbor 10.117.2.3 route-map ACCEPT in
  neighbor 10.117.2.3 route-map ANYCAST-OUT out
  neighbor 10.117.3.3 route-map ACCEPT in
  neighbor 10.117.3.3 route-map ANYCAST-OUT-BACKUP out
 exit-address-family
exit
