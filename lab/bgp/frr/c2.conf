frr defaults traditional
hostname c2
log stdout informational
service integrated-vtysh-config
!
ip route 192.0.2.64/26 blackhole
ip prefix-list OWN seq 5 permit 192.0.2.64/26
!
! AS64601 is the primary provider.
route-map FROM-PRIMARY permit 10
 set local-preference 200
exit
route-map FROM-BACKUP permit 10
 set local-preference 100
exit
route-map OWN-ONLY permit 10
 match ip address prefix-list OWN
exit
! Used only by the leak injection (lab/bgp/lab.py inject leak): export everything.
route-map LEAK permit 10
exit
route-map DENY deny 10
exit
!
router bgp 64702
 bgp router-id 10.117.7.2
 neighbor 10.117.7.3 remote-as 64601
 neighbor 10.117.7.3 description t1b (provider)
 neighbor 10.117.8.3 remote-as 64602
 neighbor 10.117.8.3 description t2 (provider)
 neighbor 10.117.100.2 remote-as 65000
 neighbor 10.117.100.2 description collector
 address-family ipv4 unicast
  network 192.0.2.64/26
  neighbor 10.117.7.3 route-map FROM-PRIMARY in
  neighbor 10.117.7.3 route-map OWN-ONLY out
  neighbor 10.117.8.3 route-map FROM-BACKUP in
  neighbor 10.117.8.3 route-map OWN-ONLY out
  neighbor 10.117.100.2 route-map DENY in
  neighbor 10.117.100.2 route-map OWN-ONLY out
 exit-address-family
exit
